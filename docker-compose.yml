# 飞牛影视（trimmedia）+ OpenList 网盘挂载 完整部署
#
# 用法：
#   1. 把下面所有 /volume1/docker 改成你 NAS 上的实际路径
#   2. 确认端口 2290（飞牛影视）和 15827（OpenList）没被占用
#   3. 在同目录执行： docker compose up -d
#
# 提示：群晖需要先在「套件中心」安装 Container Manager
#       不支持核显的机器，把 devices 两行删掉（改成纯软件解码）

services:
  # ---------- 飞牛影视（独立版 / trim 刮削） ----------
  trimmedia:
    image: ghcr.io/satxm/trimmedia:latest
    container_name: trimmedia
    restart: unless-stopped
    environment:
      - PUID=1000 # 改成 `id -u` 的输出
      - GUID=1000 # 改成 `id -g` 的输出
    ports:
      - "2290:8005" # 左边是浏览器访问端口，可自定义
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /volume1/docker/trimmedia/media:/vol1/1000/media # 媒体目录（strm 落在这里），必须
      # 可选：想把播放记录/刮削结果持久化就打开下面这行（不打开则容器重建后媒体库要重扫一遍）
      # - /volume1/docker/trimmedia/data:/vol1/@appdata/trim.media
      - /dev/dri/by-path:/dev/dri/by-path

  # ---------- OpenList（网盘转 WebDAV + 生成 strm） ----------
  openlist:
    image: openlistteam/openlist:v4.2.10-aio
    container_name: openlist
    restart: unless-stopped
    user: "1001:1001" # 必须与 strm 目录属主一致，否则无法写入
    environment:
      - UMASK=022
    ports:
      - "15827:5244" # 左边是浏览器访问端口，可自定义
    volumes:
      - /volume1/docker/openlist:/opt/openlist/data
      - /volume1/docker/trimmedia/media/strm:/strm # 与上面的 media 目录保持同一父目录

  # ---------- trimmedia-ext（数据库扩展接口，可选） ----------
  # 配合篡改猴插件实现「标题排序修复」等官方接口做不到的能力（详见 README 第 8 章）
  # 启用方法：去掉下面各行行首的 "# "，把两处路径/地址改成你的实际值
  #
  # trimmedia-ext:
  #   image: python:3.11-alpine3.20 # 固定版本，纯标准库零依赖，无 build 无 pip
  #   container_name: trimmedia-ext
  #   restart: unless-stopped
  #   ports:
  #     - "2291:80" # 约定：影视端口 +1（2290 -> 2291），插件默认按此自动寻址
  #   environment:
  #     - FNTV_DB=/data/database/trimmedia.db # 挂载目录里 trimmedia.db 的位置
  #     - FNTV_BACKUP_DIR=/data/ext-backups   # 自动备份目录（保留最新 10 份）
  #     - FNTV_TRIM_URL=http://192.168.8.138:2290 # 你的飞牛影视地址，用于管理员鉴权
  #     # - FNTV_TOKEN=调试用静态token        # 可选，给 curl 调试用
  #   volumes:
  #     - ./ext:/ext:ro # 本仓库的 ext/server.py，明文可审计
  #     - /volume1/docker/trimmedia/data:/data # trimmedia 的数据目录（含 database/trimmedia.db）
  #   command: python /ext/server.py

